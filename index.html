<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CU Prompt โดยคณะวิศวกรรมศาสตร์ จุฬาฯ</title>
    <!-- Tailwind CSS Play CDN (Allowed for fast styling in vanilla) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style type="text/tailwindcss">
        @theme {
        --color-brand: #1a1a1a;
        --color-brand-hover: #333333;
        --font-serif: "Prompt", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
</head>

<body class="bg-[#fdfdfd] text-[#1a1a1a] antialiased min-h-screen flex flex-col">

    <!-- App Header -->
    <header
        class="sticky top-0 z-40 bg-[#fdfdfd] border-b border-[#1a1a1a]/10 px-8 py-8 flex items-end justify-between">
        <div class="flex items-center space-x-4">
            <button id="back-btn" onclick="goBack()"
                class="p-2 -ml-2 hover:bg-gray-100 rounded-none transition-colors hidden">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
            </button>
            <div>
                <p class="text-xs uppercase tracking-[0.2em] font-bold mb-1 opacity-40">รวมคำสั่ง AI อินเทรนด์
                </p>
                <h1 class="editorial-title font-serif italic font-light tracking-tight">
                    CU<span class="font-bold tracking-tight">Prompt</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center">
            <div id="header-logo" class="bg-[#AA0000] px-4 py-2 rounded-xl transition-all duration-300 origin-right">
                <img src="/pict/ChulaENG-AI-logo-white.png" alt="Chula Engineering AI Logo" class="h-8 w-auto">
            </div>
        </div>
    </header>

    <!-- Hero: The 2026 Cinematic Collage -->
    <div id="gallery-hero" class="relative overflow-hidden bg-[#0a0a0a] w-full py-24 lg:py-40 border-b border-white/10">
        <!-- Deep Parallax Layers -->
        <div id="hero-collage-far" class="absolute inset-0 opacity-10 pointer-events-none"></div>
        <div id="hero-collage" class="absolute inset-0 opacity-20 pointer-events-none"></div>
        
        <!-- Dark Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/40 to-transparent z-10"></div>

        <div class="relative z-20 max-w-4xl mx-auto px-8 text-center">
            <h2 class="text-6xl md:text-8xl font-serif font-light leading-[0.85] tracking-tighter mb-12 text-white">
                ยังสั่ง AI <br />
                <span id="dynamic-keyword" class="italic font-normal text-brand inline-block min-w-[200px] transition-all duration-500">ไม่เก่ง</span> <br />
                <span class="font-medium">ไม่เป็นไร</span>
            </h2>
            <p class="text-lg md:text-xl text-white/70 max-w-2xl mx-auto leading-relaxed font-light">
                ทุกคนสามารถเปลี่ยนไอเดียสร้างสรรค์เป็นภาพล้ำ ๆ ได้ <br class="hidden md:block"/>
                แค่ลองเลือกเทมเพลตที่ถูกใจมาปรับแต่งตามสไตล์คุณ ยิ่งเล่นบ่อยคุณยิ่งเก่งขึ้น
            </p>
        </div>
    </div>

    <main class="flex-1 px-8 py-8 w-full">

        <div id="gallery-view">
            <!-- Categories -->
            <div id="category-filters"
                class="flex items-center space-x-10 border-b border-[#1a1a1a]/5 pb-4 mb-8 overflow-x-auto no-scrollbar">
                <!-- Populated by JS -->
            </div>

            <!-- Grid -->
            <div id="gallery-grid"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8 mt-6">
                <!-- Populated by JS -->
            </div>
        </div>

        <div id="detail-view" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start mb-20">
                <div id="image-gallery-container" class="lg:col-span-5 grid grid-cols-1 gap-6">
                    <div class="aspect-[3/4] overflow-hidden shadow-sm border border-black/5 relative max-w-[640px] mx-auto lg:mx-0">
                        <div id="output-badge"
                            class="hidden absolute top-4 left-4 px-2 py-1 bg-white border border-black/10 text-[11px] text-black uppercase font-bold tracking-widest z-10">
                            ผลลัพธ์</div>
                        <img id="detail-image" src="" alt=""
                            class="w-full h-full object-cover grayscale-[0.2] hover:grayscale-0 transition-all duration-700"
                            referrerpolicy="no-referrer">
                    </div>
                    <!-- Dynamic Input Images Grid -->
                    <div id="dynamic-input-list" class="hidden">
                        <!-- Input images will be injected here -->
                    </div>
                </div>
                <div class="lg:col-span-7 py-4">
                    <span id="detail-category"
                        class="text-sm font-serif italic text-gray-600 border-b border-gray-200 pb-1 mb-6 inline-block"></span>

                    <h2 id="detail-title" class="text-5xl font-serif font-light leading-tight mb-12"></h2>

                    <div class="mb-12">
                        <label class="technical-label block mb-6">ปรับแต่งพรอมต์</label>
                        <div id="thai-tags" class="flex flex-wrap items-center">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Instructions Section -->
                    <div id="ai-instructions" class="hidden mt-12 pt-8 border-t border-black/5">
                        <label class="technical-label block mb-4">วิธีสั่ง AI ให้สร้างภาพ</label>
                        <div id="instruction-content" class="text-sm text-gray-600 space-y-4 font-light leading-relaxed">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Fixed Prompt Bar -->
    <div id="fixed-prompt-bar" class="fixed-bar">
        <div
            class="max-w-5xl mx-auto px-8 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-6">
            <div class="flex-1">
                <label class="technical-label block mb-2 text-[10px] opacity-60">พรอมต์สำหรับนำไปใช้</label>
                <div id="english-output"
                    class="font-mono text-sm leading-relaxed text-gray-700 bg-gray-50 p-4 border border-black/5 max-h-[80px] overflow-y-auto select-all">
                </div>
            </div>
            <div class="shrink-0 flex items-center">
                <button id="copy-btn" onclick="handleCopy()"
                    class="w-full md:w-auto px-10 py-5 bg-[#1a1a1a] text-white hover:bg-black transition-all flex items-center justify-center gap-3 uppercase text-xs tracking-[0.2em] font-bold shadow-xl">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                    </svg>
                    คัดลอกพรอมต์
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-1">ปรับแต่งหัวข้อ</p>
                    <h4 id="modal-title" class="text-2xl font-bold"></h4>
                </div>
                <button onclick="closeModal()"
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="rotate-270">
                        <path d="m18 15-6-6-6 6"></path>
                    </svg>
                </button>
            </div>

            <div id="modal-options" class="grid grid-cols-1 mb-8">
                <!-- Populated by JS -->
            </div>

            <div class="mb-8 pt-6 border-t border-[#1a1a1a]/10">
                <label class="technical-label block mb-4">กำหนดค่าเอง</label>
                <div class="flex gap-2">
                    <input id="custom-input" type="text" placeholder="พิมพ์ค่าที่ต้องการ..."
                        class="flex-1 px-4 py-4 bg-gray-50 border-2 border-transparent focus:border-brand outline-none transition-all font-mono text-sm uppercase" />
                    <button id="apply-custom-btn"
                        class="px-6 py-4 bg-black text-white text-xs uppercase tracking-widest font-bold">
                        นำไปใช้
                    </button>
                </div>
            </div>

            <div class="bg-gray-50 -mx-6 -mb-6 p-4 text-center">
                <button onclick="closeModal()"
                    class="text-sm font-bold text-gray-600 hover:text-brand">ย้อนกลับ</button>
            </div>
        </div>
    </div>

    <!-- Footer Bar -->
    <footer
        class="mt-auto bg-[#aa0000] text-[#fdfdfd] h-12 flex items-center px-8 justify-between text-xs tracking-[0.2em] font-medium uppercase shrink-0">
        <!-- <span>AI ENGINE READY</span> -->
        <div class="flex gap-8">
            <span class="hidden sm:inline">REV: 1.0.0</span>
            <span>คณะวิศวกรรมศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/parser.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
