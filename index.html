<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Prompt Thai - สร้างพรอพเท่ๆ ในแบบไทย</title>
    <!-- Tailwind CSS Play CDN (Allowed for fast styling in vanilla) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style type="text/tailwindcss">
      @theme {
        --color-brand: #1a1a1a;
        --color-brand-hover: #333333;
        --font-serif: "DM Serif Display", serif;
        --font-mono: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body class="bg-[#fdfdfd] text-[#1a1a1a] antialiased">
    
    <!-- App Header -->
    <header class="sticky top-0 z-40 bg-[#fdfdfd] border-b border-[#1a1a1a]/10 px-8 py-8 flex items-end justify-between">
      <div class="flex items-center space-x-4">
        <button id="back-btn" onclick="goBack()" class="p-2 -ml-2 hover:bg-gray-100 rounded-none transition-colors hidden">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div>
          <p class="text-[10px] uppercase tracking-[0.3em] font-bold mb-1 opacity-40">AI PROMPT GENERATOR / THAI EDITION</p>
          <h1 class="editorial-title font-serif italic font-light tracking-tight">
            Prompt<span class="font-serif">Thai</span>
          </h1>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-right">
        <div class="hidden sm:block">
          <p class="text-[10px] uppercase tracking-widest font-bold mb-1 text-gray-400">Classification</p>
          <p class="text-xs font-medium uppercase tracking-tighter">Public / Creative Tools</p>
        </div>
        <button class="p-2 hover:bg-gray-100 transition-colors text-gray-500">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-8 py-12">
      
      <!-- Gallery View -->
      <div id="gallery-view">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-12 mb-16 items-end">
          <div class="md:col-span-8">
            <h2 class="text-6xl font-serif font-light leading-[0.9] mb-8">
              Visual <br/> Discovery <br/> & Selection
            </h2>
            <p class="text-sm leading-relaxed text-gray-500 max-w-sm">
              Select an architectural foundation from our curated library of Thai-centric visual prompts.
            </p>
          </div>
          <div class="md:col-span-4">
            <div class="relative group">
              <input 
                id="search-input"
                type="text" 
                placeholder="SEARCH ARCHIVE..."
                class="w-full px-0 py-2 bg-transparent border-b border-[#1a1a1a]/20 focus:border-brand outline-none transition-all font-mono text-xs tracking-widest uppercase"
              />
            </div>
          </div>
        </div>

        <!-- Categories -->
        <div id="category-filters" class="flex space-x-8 border-b border-[#1a1a1a]/10 pb-4 mb-12 overflow-x-auto no-scrollbar">
          <!-- Populated by JS -->
        </div>

        <!-- Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6">
          <!-- Populated by JS -->
        </div>
      </div>

      <div id="detail-view" class="hidden">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start mb-20">
          <div class="lg:col-span-5 aspect-[3/4] overflow-hidden shadow-sm border border-black/5">
            <img id="detail-image" src="" alt="" class="w-full h-full object-cover grayscale-[0.2] hover:grayscale-0 transition-all duration-700" referrerpolicy="no-referrer">
          </div>
          <div class="lg:col-span-7 py-4">
            <label class="technical-label block mb-2">Selected Parameters</label>
            <span id="detail-category" class="text-xs font-serif italic text-gray-400 border-b border-gray-100 pb-1 mb-6 inline-block"></span>
            
            <h2 id="detail-title" class="text-5xl font-serif font-light leading-tight mb-12"></h2>
            
            <div class="mb-12">
              <label class="technical-label block mb-6">Interactive Specification</label>
              <div id="thai-tags" class="flex flex-wrap items-center">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>
        </div>

        <div class="border-t border-[#1a1a1a] border-opacity-10 pt-12">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-8">
            <div class="flex-1">
              <label class="technical-label block mb-4">Exportable Specification</label>
              <div id="english-output" class="font-mono text-sm leading-relaxed text-gray-500 bg-gray-50 p-8 border border-black/5 min-h-[120px] select-all">
              </div>
            </div>
            <div class="shrink-0">
              <button 
                id="copy-btn"
                onclick="handleCopy()"
                class="w-full md:w-auto px-12 py-4 bg-[#1a1a1a] text-white hover:bg-black transition-all flex items-center justify-center gap-3 uppercase text-[10px] tracking-[0.3em] font-bold"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                EXECUTE COPY
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
      <div class="modal-content">
        <div class="flex items-center justify-between mb-6">
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">ปรับแต่งหัวข้อ</p>
            <h4 id="modal-title" class="text-2xl font-bold"></h4>
          </div>
          <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-270"><path d="m18 15-6-6-6 6"></path></svg>
          </button>
        </div>

        <div id="modal-options" class="grid grid-cols-1 mb-8">
          <!-- Populated by JS -->
        </div>

        <div class="mb-8 pt-6 border-t border-[#1a1a1a]/10">
          <label class="technical-label block mb-4">Manual Override</label>
          <div class="flex gap-2">
            <input 
              id="custom-input"
              type="text" 
              placeholder="TYPE CUSTOM VALUE..."
              class="flex-1 px-4 py-4 bg-gray-50 border-2 border-transparent focus:border-brand outline-none transition-all font-mono text-xs uppercase"
            />
            <button 
              id="apply-custom-btn"
              class="px-6 py-4 bg-black text-white text-[10px] uppercase tracking-widest font-bold"
            >
              Apply
            </button>
          </div>
        </div>
        
        <div class="bg-gray-50 -mx-6 -mb-6 p-4 text-center">
          <button onclick="closeModal()" class="text-sm font-bold text-gray-400 hover:text-brand">ย้อนกลับ</button>
        </div>
      </div>
    </div>

    <!-- Footer Bar -->
    <footer class="mt-20 bg-[#1a1a1a] text-[#fdfdfd] h-12 flex items-center px-8 justify-between text-[10px] tracking-[0.3em] font-medium uppercase">
      <span>AI ENGINE READY</span>
      <div class="flex gap-8">
        <span class="hidden sm:inline">REV: 2.4.0</span>
        <span>PROMPTTHAI-MOD-26</span>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="js/parser.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
